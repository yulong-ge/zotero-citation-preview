name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --locked
      - name: Check and build
        env:
          MAINTENANCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run check
      - uses: actions/upload-artifact@v6
        with:
          name: citation-preview-xpi
          path: dist/citation-preview-*.xpi
          if-no-files-found: error
