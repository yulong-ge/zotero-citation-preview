name: Zotero GUI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_metadata:
        description: Also verify Issue 1 with live Crossref and arXiv
        type: boolean
        default: false
      release_tag:
        description: Optional published tag to install instead of the local build
        type: string
        default: ""
      release_sha256:
        description: Required XPI SHA256 when verifying a published tag
        type: string
        default: ""

permissions:
  contents: read

jobs:
  native-reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.16"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libdbus-glib-1-2 libasound2t64 xvfb xauth fonts-noto-cjk
      - name: Install pinned Zotero
        run: scripts/setup-cloud-zotero.sh "$RUNNER_TEMP/zotero"
      - name: Build production addon and generated PDF
        run: |
          mkdir -p .local/cloud-gui
          archive="$(uv run python scripts/build.py)"
          cp "$archive" .local/cloud-gui/citation-preview.xpi
          uv run --locked python test/host/make_fixture.py .local/cloud-gui/fixture.pdf
          uv run --locked python test/host/make_fixture.py .local/cloud-gui/parser-failure.pdf parser-failure
      - name: Download published installer for verification
        if: github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.release_sha256 != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA256: ${{ inputs.release_sha256 }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo 'release_sha256 must be the verified lowercase XPI SHA256' >&2
            exit 1
          fi
          curl --fail --location --retry 3 --max-time 120 \
            "https://github.com/yulong-ge/zotero-citation-preview/releases/download/$RELEASE_TAG/citation-preview-${RELEASE_TAG#v}.xpi" \
            -o .local/cloud-gui/citation-preview.xpi
          echo "$RELEASE_SHA256  .local/cloud-gui/citation-preview.xpi" | sha256sum --check -
          uv run --locked python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('.local/cloud-gui/citation-preview.xpi') as archive:
              if json.loads(archive.read('manifest.json')) != json.loads(Path('manifest.json').read_text()):
                  raise ValueError('Published installer manifest differs from the checked-out source')
          PY
      - name: Download pinned public Kalman-Edit PDF
        run: |
          curl --fail --location --retry 3 --max-time 120 https://papers.nips.cc/paper_files/paper/2025/file/d01db5cd2555ba11f75da0454d57b903-Paper-Conference.pdf -o .local/cloud-gui/kalman-edit.pdf
          echo '762f54a8c26368c686240805ef658d5e953d8dc8b32aeea95beb396466753484  .local/cloud-gui/kalman-edit.pdf' | sha256sum --check -
      - name: Test native hover, metadata, dismissal and cleanup
        run: |
          for reference in 2 44; do
            xvfb-run -a uv run --locked python test/host/run.py \
              --zotero "$RUNNER_TEMP/zotero/Zotero_linux-x86_64/zotero" \
              --xpi .local/cloud-gui/citation-preview.xpi \
              --pdf .local/cloud-gui/fixture.pdf \
              --destination "cite.fixture${reference}" \
              --output ".local/cloud-gui/reference-${reference}"
          done
          for case in metadata-failure parser-failure multiple; do
            pdf=.local/cloud-gui/fixture.pdf
            if [ "$case" = parser-failure ]; then pdf=.local/cloud-gui/parser-failure.pdf; fi
            xvfb-run -a uv run --locked python test/host/run.py \
              --case "$case" \
              --zotero "$RUNNER_TEMP/zotero/Zotero_linux-x86_64/zotero" \
              --xpi .local/cloud-gui/citation-preview.xpi \
              --pdf "$pdf" \
              --destination cite.fixture44 \
              --output ".local/cloud-gui/${case}"
          done
      - name: Test Issue 1 on the public paper
        run: |
          xvfb-run -a uv run --locked python test/host/run.py \
            --case issue-1 \
            --zotero "$RUNNER_TEMP/zotero/Zotero_linux-x86_64/zotero" \
            --xpi .local/cloud-gui/citation-preview.xpi \
            --pdf .local/cloud-gui/kalman-edit.pdf \
            --destination cite.sohl2015deep \
            --output .local/cloud-gui/issue-1
      - name: Verify live metadata for Issue 1
        if: github.event_name == 'workflow_dispatch' && inputs.live_metadata
        run: |
          xvfb-run -a uv run --locked python test/host/run.py \
            --case issue-1-live \
            --zotero "$RUNNER_TEMP/zotero/Zotero_linux-x86_64/zotero" \
            --xpi .local/cloud-gui/citation-preview.xpi \
            --pdf .local/cloud-gui/kalman-edit.pdf \
            --destination cite.sohl2015deep \
            --output .local/cloud-gui/issue-1-live
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zotero-gui-evidence
          path: |
            .local/cloud-gui/**/result.json
            .local/cloud-gui/**/screenshot.png
            .local/cloud-gui/**/process.log
            .local/cloud-gui/**/console.log
            .local/cloud-gui/fixture.pdf
            .local/cloud-gui/parser-failure.pdf
          if-no-files-found: warn
