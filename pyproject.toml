[project]
name = "zotero-citation-preview"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "actionlint-py==1.7.12.25",
  "markdown-it-py==4.0.0",
  "pikepdf==9.11.0",
  "pre-commit==4.5.1",
  "pyyaml==6.0.3",
  "reportlab==4.4.5",
  "ruff==0.17.0",
  "shellcheck-py==0.11.0.1",
  "shfmt-py==4.2.0",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".local", "node_modules", "dist", ".agents/notes/archived"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
